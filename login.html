<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- bootstrap start -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- bootstrap end -->
    <!-- font awsome start -->
    <link rel="stylesheet" href="css/all.css">
    <!-- font awsome end -->
    <!-- start google font -->  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- end google font -->
    <!-- style css start -->
    <link rel="stylesheet" href="css/style.css">
    <!-- style css end -->
</head>

<body>
      
    <!-- navbar -->
       <nav class="navbar fixed-top bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="images/logo-01.png" alt="" class="img-fluid">
    </a>
    
    <div class="d-flex align-items-center">
      
    </div>
  </div>
</nav>
<div class="navbar-spacer"></div>
<!-- ////////////////////////////////////////////////////////////////////////////////////////////////// -->
 <div class="login-section">
    <div class="container p-2 m-auto">   
        <div  class="w-90 m-auto p-4 shadow-sm bg-white rounded">
            <h2 class="text-center">Login</h2>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email_login" name="email" required placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password_login" name="password" required placeholder="Enter your password">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary rounded-pill" id="loginSubmitBtn">Login</button>
            <a href="register.html" class="d-block text-center mt-3">Don't have an account? Register</a>
          </div>
    </div>
 </div>
 <!-- /////////////////////////////////////////////////////////////////////////////////////////////////// -->
    <!-- bootstrap js start -->

     <script src="js/login.js"></script>
</body>

</html>
